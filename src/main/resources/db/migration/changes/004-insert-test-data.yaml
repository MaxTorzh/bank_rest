      author: bank-app
      context: test, dev
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: transfers
        - sqlCheck:
            sql: "SELECT COUNT(*) FROM transfers"
            expectedResult: "0"
        - sqlCheck:
            sql: "SELECT COUNT(*) FROM bank_cards WHERE id IN (1, 2)"
